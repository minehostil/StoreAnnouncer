name: StoreAnnouncer
version: 1.0.0
main: org.minehostil.storeannouncer.StoreAnnouncerPlugin
api-version: '1.21'
description: Announces Tebex store purchases (with skin head in chat) and triggers GG Waves with rewards.
author: TuNombre

commands:
  store:
    description: StoreAnnouncer admin commands
    usage: /<command> <reload|advertise|ggwave>
    permission: storeannouncer.admin
    # Alias opcional para compatibilidad con comandos antiguos (/tienda ...)
    aliases: [tienda]

permissions:
  storeannouncer.admin:
    description: Access to /store
    default: op